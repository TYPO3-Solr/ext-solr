name: Publish docker image
run-name: "Rebuild docker image for EXT:solr ${{ inputs.release_tag }}"

# The single definition of the docker-hub publishing. ci.yml calls it after the tests for branch
# and tag pushes; started manually, it re-publishes an already released version, e.g. to pick up
# a patched Solr/Java base image, without a new release and without touching TER.
on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Released version to build instead of github.ref'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Released EXT:solr version of this branch to rebuild, e.g. 12.1.5'
        required: true
        type: string

jobs:
  publish-docker-hub:
    name: Publish docker-image to docker-hub
    runs-on: ubuntu-latest
    env:
      DOCKER_PLATFORMS:  "linux/amd64,linux/arm64,linux/ppc64le"
      DOCKER_HUB_IMAGE_NAME: "${{ secrets.DOCKERHUB_USERNAME }}/ext-solr"
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}

      - name: enrich Environment Variables
        id: env
        run: |
          echo "NOW=$(date +'%F %Z %T')" >> $GITHUB_ENV
          BRANCH_ALIAS_TAG=$(jq -r '.extra."branch-alias" | to_entries | .[0].value' composer.json)
          echo "BRANCH_TAG=$(jq -r '.extra."branch-alias" | to_entries | .[0].key' composer.json)" >> $GITHUB_ENV
          echo "BRANCH_ALIAS_TAG=$BRANCH_ALIAS_TAG" >> $GITHUB_ENV
          echo "BUILD_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          if [[ -n "$RELEASE_TAG" ]]; then
            # Only stable tags of this branch: the docs URLs below and the image tags are per branch.
            BRANCH_VERSION="${BRANCH_ALIAS_TAG%.x-dev}"
            if ! [[ "$RELEASE_TAG" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || [[ "$RELEASE_TAG" != "$BRANCH_VERSION".* ]]; then
              >&2 echo "${RELEASE_TAG} is not a stable ${BRANCH_VERSION}.x release."
              exit 1
            fi
            echo "BUILD_VERSION=$RELEASE_TAG" >> $GITHUB_ENV
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "BUILD_VERSION=$GITHUB_REF_NAME" >> $GITHUB_ENV
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKER_HUB_IMAGE_NAME }}

          # Only main, the newest major EXT:solr branch, may push the latest tag. Without
          # latest=false, every semver tag would also push latest.
          flavor: |
            latest=false
          # The branch-alias tags only follow while the branch points at the built commit, so a
          # rebuild of an older release never replaces newer dev images.
          tags: |
            type=raw,value=${{ env.BRANCH_TAG }},enable=${{ env.BUILD_SHA == github.sha }}
            type=raw,value=${{ env.BRANCH_ALIAS_TAG }},enable=${{ env.BUILD_SHA == github.sha }}
            type=semver,pattern={{version}},value=${{ env.BUILD_VERSION }},enable=${{ env.BUILD_VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.BUILD_VERSION }},enable=${{ env.BUILD_VERSION != '' }}
          labels: |
            org.opencontainers.image.title=${{github.event.repository.name}}
            org.opencontainers.image.description=Docker image for Apache Solr for TYPO3 CMS EXT:solr extension
            org.opencontainers.image.vendor=${{github.repository_owner}}
            org.opencontainers.image.licenses=GPL-3.0,APACHE
            org.opencontainers.image.version=${{ env.BUILD_VERSION || github.ref_name }}
            org.opencontainers.image.created=${{ env.NOW }}
            org.opencontainers.image.source=${{github.server_url}}/${{github.repository}}
            org.opencontainers.image.revision=${{ env.BUILD_SHA }}
            org.opencontainers.image.url=https://docs.typo3.org/p/apache-solr-for-typo3/solr/main/en-us/Appendix/DockerTweaks.html
            org.opencontainers.image.documentation=https://docs.typo3.org/p/apache-solr-for-typo3/solr/main/en-us/Index.html

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A rebuild puts a released version on a newer base image than it was tested with. ci.yml
      # tests every other build before calling this workflow.
      -
        name: Build docker image for the smoke test
        if: inputs.release_tag
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Docker/SolrServer/Dockerfile
          load: true
          tags: solrci-image:latest

      -
        name: Smoke test docker image
        if: inputs.release_tag
        run: ./Build/Test/cibuild_docker.sh

      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Docker/SolrServer/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
